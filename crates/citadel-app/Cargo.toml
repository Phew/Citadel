[package]
name = "citadel-app"
description = "The Citadel app core: session, transports, KT verification, and the outbox/inbox loops over citadel-core's encrypted store. Hosts (native UIs, the web client) sit on top of this."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
citadel-core = { workspace = true }
citadel-proto = { workspace = true }
kt-log = { workspace = true }
openmls = "=0.8.1"
openmls_traits = "=0.5.0"
openmls_rust_crypto = "0.5"
tls_codec = "0.4"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
zeroize = "1"
reqwest = { workspace = true }
# ws:// and wss:// to the gateway; rustls only (deny.toml bans native-tls).
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
futures-util = "0.3"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
test-harness = { path = "../test-harness" }
tempfile = "3"
anyhow = { workspace = true }
tracing-subscriber = { workspace = true }
citadel-core = { workspace = true, features = ["testing"] }
