[package]
name = "test-harness"
description = "Multi-client integration test utilities and M0 stack probes"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "test_harness"
path = "src/lib.rs"

[[bin]]
name = "wait-healthy"
path = "src/bin/wait_healthy.rs"

[[bin]]
name = "canary-scan"
path = "src/bin/canary_scan.rs"

# On-demand perf baselines (not default CI). PLAN.md §13: fails loud without stack.
[[bin]]
name = "perf-baseline"
path = "perf/main.rs"

[dependencies]
citadel-proto = { workspace = true }
# The harness stands in for real clients in the M2 DM evidence tests: it
# drives citadel-core's actual MLS engine (never a reimplementation) against
# the live stack. Client-side crypto is legitimate here (INV-2; the rule-6
# confinement check covers only the four service crates).
citadel-core = { workspace = true, features = ["testing"] }
openmls = "0.8"
openmls_traits = "0.5"
tls_codec = "0.4"
zeroize = "1"
# The dishonest-DS proxy for the adversarial suite (dishonest.rs).
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
# WS client for the gateway path in dm.rs (lib): plain ws:// on the compose
# stack (TLS termination is a deploy concern, M8); "handshake" only, so no
# TLS backend enters the graph (deny.toml bans native-tls/openssl) and the
# version stays lockstep with axum 0.8's ws support.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
futures-util = "0.3"
# Evidence scans against real PostgreSQL (PLAN.md §4 stack). Dynamic queries
# only; the scanner needs no compile-time-checked macros.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid"] }
# Client-side signing for tests (testkeys): the harness stands in for the
# client, which legitimately owns crypto (INV-2; ADR-0002 §4 rev 2 scope
# note — the confinement check covers only the four service crates).
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
# Client-side KT verification in the M1 acceptance test (INV-4: clients
# verify everything — the harness proves it against the live stack).
kt-log = { workspace = true }

[dev-dependencies]
citadel-service-crypto = { workspace = true }
